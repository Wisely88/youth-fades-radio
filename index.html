<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b14">
  <title>青春流逝电台</title>
  <meta name="description" content="抖音热门歌曲 · 随机电台">
  <link rel="stylesheet" href="/youth-fades-radio/styles.css">
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="veil"></div>

  <main class="stage">
    <header class="brand">
      <div class="eyebrow">DOUYIN HOT · YOUTH FADES RADIO</div>
      <h1>青春流逝电台</h1>
      <p>抖音热门歌曲 · 随机电台</p>
      <span>有些歌，只需要再听一小段。</span>
    </header>

    <section class="memory-card" aria-live="polite">
      <figure class="memory-photo">
        <img id="cover" src="" alt="">
      </figure>

      <div class="cassette" id="cassette" aria-label="当前磁带">
        <div class="cassette-shell">
          <div class="cassette-label">
            <div class="label-top">YOUTH FADES / RANDOM TAPE</div>
            <div class="label-title" id="tapeTitle">等待播放</div>
            <div class="label-artist" id="tapeArtist">—</div>
            <div class="reel-window">
              <div class="reel left"><i></i><i></i><i></i><i></i></div>
              <div class="tape-line"></div>
              <div class="reel right"><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="label-bottom">SIDE A · DOUYIN HOT</div>
          </div>
          <div class="cassette-screws"><b></b><b></b><b></b><b></b></div>
        </div>
      </div>

      <div class="meta">
        <strong id="title">青春流逝电台</strong>
        <span id="artist">随机等待一段声音</span>
      </div>

      <div class="controls">
        <button id="playBtn" class="play" type="button" aria-label="播放">
          <span class="play-icon">▶</span>
        </button>

        <div class="volume-wrap">
          <span class="volume-icon">◉</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.72" aria-label="音量">
        </div>
      </div>
    </section>
  </main>

  <audio id="audio" preload="metadata"></audio>
  <script src="/youth-fades-radio/app.js"></script>
</body>
</html>
