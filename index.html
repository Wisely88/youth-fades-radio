<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b14">
  <title>青春流逝电台</title>
  <meta name="description" content="抖音热门歌曲 · 随机电台">
  <style>
:root{
  --bg:#0b0b14;--text:#f4efe6;--muted:#a9a2ae;--accent:#d8a85b;
  --label:#d6c8aa;--ink:#24201a;--shell:#5b5760;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100dvh;overflow-x:hidden}
button,input{font:inherit}
.bg,.veil{position:fixed;inset:0;pointer-events:none}
.bg{z-index:-3;background:radial-gradient(circle at 20% 20%,rgba(216,168,91,.18),transparent 34%),linear-gradient(135deg,#151525,#090912);background-size:cover;background-position:center;filter:blur(26px) saturate(.9);transform:scale(1.08);transition:background-image .7s ease,opacity .7s ease}
.veil{z-index:-2;background:linear-gradient(180deg,rgba(8,8,17,.58),rgba(8,8,17,.82) 68%,rgba(8,8,17,.94))}
.stage{min-height:100dvh;width:min(760px,calc(100% - 32px));margin:0 auto;padding:40px 0 max(38px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}
.brand{text-align:center;margin-bottom:26px}
.brand .eyebrow{font-size:10px;letter-spacing:.22em;color:var(--accent);font-weight:700}
.brand h1{margin:9px 0 6px;font-family:Georgia,"Songti SC",serif;font-size:clamp(32px,6vw,54px);font-weight:500;letter-spacing:.04em}
.brand p{margin:0;color:#ddd6cb;font-size:13px;letter-spacing:.08em}
.brand span{display:block;margin-top:8px;color:var(--muted);font-size:11px}
.memory-card{width:min(520px,100%);margin:0 auto;padding:18px 18px 22px;border:1px solid rgba(255,255,255,.08);border-radius:22px;background:rgba(20,20,34,.58);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.34)}
.memory-photo{margin:0 0 18px;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:linear-gradient(135deg,#302c34,#171720)}
.memory-photo img{width:100%;height:100%;object-fit:cover;display:block;opacity:.94;transition:opacity .45s ease,transform 5s ease}
body.playing .memory-photo img{transform:scale(1.025)}
.cassette{margin:0 auto 18px;width:min(420px,100%)}
.cassette-shell{position:relative;aspect-ratio:1.7/1;border-radius:14px;padding:16px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.02)),var(--shell);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 0 0 3px rgba(255,255,255,.03),0 18px 40px rgba(0,0,0,.32);transition:background .45s ease}
.cassette-label{height:100%;padding:14px 16px 12px;border-radius:10px;background:var(--label);color:var(--ink);box-shadow:inset 0 -10px 22px rgba(0,0,0,.06);transition:background .45s ease,color .45s ease}
.label-top,.label-bottom{font:700 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;opacity:.68}
.label-title{margin-top:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 clamp(18px,5vw,26px)/1.1 Georgia,"Songti SC",serif}
.label-artist{margin-top:4px;font-size:11px;opacity:.72}
.reel-window{margin:14px 0 12px;height:68px;display:grid;grid-template-columns:68px 1fr 68px;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(24,22,24,.78);border:2px solid rgba(255,255,255,.42);box-shadow:inset 0 4px 14px rgba(0,0,0,.48)}
.reel{position:relative;width:52px;height:52px;border-radius:50%;margin:auto;background:radial-gradient(circle,#1b1a1b 0 18%,#d9d5cb 19% 28%,#3c3a3d 29% 48%,#111 49% 100%);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.reel i{position:absolute;left:50%;top:50%;width:5px;height:17px;background:#d7d2c9;border-radius:2px;transform-origin:50% 0}
.reel i:nth-child(1){transform:translate(-50%,-3px) rotate(0deg)} .reel i:nth-child(2){transform:translate(-50%,-3px) rotate(90deg)} .reel i:nth-child(3){transform:translate(-50%,-3px) rotate(180deg)} .reel i:nth-child(4){transform:translate(-50%,-3px) rotate(270deg)}
body.playing .reel{animation:spin 2.8s linear infinite} body.playing .reel.right{animation-duration:2.45s}
@keyframes spin{to{transform:rotate(360deg)}}
.tape-line{height:4px;border-radius:999px;background:linear-gradient(90deg,#40261d,#875c45,#40261d);box-shadow:0 0 0 1px rgba(0,0,0,.38)}
.cassette-screws b{position:absolute;width:7px;height:7px;border-radius:50%;background:#1b1b20;border:1px solid #999;box-shadow:inset 0 0 0 1px #333}
.cassette-screws b:nth-child(1){left:8px;top:8px}.cassette-screws b:nth-child(2){right:8px;top:8px}.cassette-screws b:nth-child(3){left:8px;bottom:8px}.cassette-screws b:nth-child(4){right:8px;bottom:8px}
.meta{text-align:center;margin-top:4px}.meta strong{display:block;font-family:Georgia,"Songti SC",serif;font-size:20px;font-weight:500}.meta span{display:block;margin-top:5px;color:var(--muted);font-size:11px}
.controls{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.play{width:62px;height:62px;border:1px solid rgba(255,255,255,.16);border-radius:50%;color:#1c1308;background:var(--accent);cursor:pointer;box-shadow:0 12px 26px rgba(216,168,91,.18);transition:transform .18s ease}
.play:active{transform:scale(.96)} .play span{font-size:19px;display:block;transform:translateX(2px)} body.playing .play span{transform:none}
.volume-wrap{display:flex;align-items:center;gap:10px;width:min(220px,74%);opacity:.74}.volume-icon{font-size:10px;color:var(--muted)}#volume{width:100%;accent-color:var(--accent);height:3px}

.timer-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.timer-btn{border:0;background:transparent;color:var(--muted);font-size:12px;letter-spacing:.08em;padding:4px 8px;cursor:pointer;opacity:.72}
.timer-btn.active{color:var(--accent);opacity:1}
.timer-menu{display:none;grid-template-columns:repeat(3,minmax(58px,1fr));gap:8px;width:min(260px,86%);padding:10px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(8,8,16,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.timer-menu.open{display:grid}
.timer-option{border:1px solid rgba(255,255,255,.09);border-radius:9px;background:rgba(255,255,255,.035);color:var(--text);font-size:11px;padding:8px 5px;cursor:pointer}
.timer-option.active{border-color:var(--accent);color:var(--accent)}
.timer-status{min-height:15px;color:var(--muted);font-size:10px;letter-spacing:.06em}

.fade{animation:softfade .45s ease}@keyframes softfade{0%{opacity:.28;transform:translateY(4px)}100%{opacity:1;transform:none}}
@media(max-width:560px){
  .stage{width:min(100% - 20px,520px);padding-top:24px;justify-content:flex-start}
  .brand{margin-bottom:18px}.brand h1{font-size:34px}.brand span{font-size:10px}
  .memory-card{padding:12px 12px 18px;border-radius:18px}.memory-photo{margin-bottom:14px;border-radius:12px}
  .cassette{margin-bottom:14px}.cassette-shell{padding:11px}.cassette-label{padding:11px 12px}
  .reel-window{height:56px;grid-template-columns:54px 1fr 54px;margin:10px 0}.reel{width:42px;height:42px}
  .meta strong{font-size:18px}.controls{margin-top:16px}.play{width:58px;height:58px}
}
  </style>
  <meta name="youth-fades-build" content="standalone-20260917-timer-1">
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="veil"></div>

  <main class="stage">
    <header class="brand">
      <div class="eyebrow">DOUYIN HOT · YOUTH FADES RADIO</div>
      <h1>青春流逝电台</h1>
      <p>抖音热门歌曲 · 随机电台</p>
      <span>有些歌，只需要再听一小段。</span>
    </header>

    <section class="memory-card" aria-live="polite">
      <figure class="memory-photo">
        <img id="cover" src="" alt="">
      </figure>

      <div class="cassette" id="cassette" aria-label="当前磁带">
        <div class="cassette-shell">
          <div class="cassette-label">
            <div class="label-top">YOUTH FADES / RANDOM TAPE</div>
            <div class="label-title" id="tapeTitle">等待播放</div>
            <div class="label-artist" id="tapeArtist">—</div>
            <div class="reel-window">
              <div class="reel left"><i></i><i></i><i></i><i></i></div>
              <div class="tape-line"></div>
              <div class="reel right"><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="label-bottom">SIDE A · DOUYIN HOT</div>
          </div>
          <div class="cassette-screws"><b></b><b></b><b></b><b></b></div>
        </div>
      </div>

      <div class="meta">
        <strong id="title">青春流逝电台</strong>
        <span id="artist">随机等待一段声音</span>
      </div>

      <div class="controls">
        <button id="playBtn" class="play" type="button" aria-label="播放">
          <span class="play-icon">▶</span>
        </button>

        <div class="volume-wrap">
          <span class="volume-icon">◉</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.72" aria-label="音量">
        </div>
        <div class="timer-wrap">
          <button id="timerBtn" class="timer-btn" type="button" aria-expanded="false">◷ 定时</button>
          <div id="timerMenu" class="timer-menu" aria-label="睡眠定时">
            <button class="timer-option" data-minutes="15" type="button">15 分</button>
            <button class="timer-option" data-minutes="30" type="button">30 分</button>
            <button class="timer-option" data-minutes="45" type="button">45 分</button>
            <button class="timer-option" data-minutes="60" type="button">60 分</button>
            <button class="timer-option" data-minutes="90" type="button">90 分</button>
            <button class="timer-option" data-minutes="0" type="button">关闭</button>
          </div>
          <div id="timerStatus" class="timer-status"></div>
        </div>

      </div>
    </section>
  </main>

  <audio id="audio" preload="metadata"></audio>
  <script>
(() => {
  "use strict";
  const audio=document.getElementById("audio");
  const playBtn=document.getElementById("playBtn");
  const playIcon=playBtn.querySelector(".play-icon");
  const volume=document.getElementById("volume");
  const timerBtn=document.getElementById("timerBtn");
  const timerMenu=document.getElementById("timerMenu");
  const timerStatus=document.getElementById("timerStatus");
  const timerOptions=[...document.querySelectorAll(".timer-option")];
  let sleepDeadline=0,sleepTicker=null;
  const bg=document.getElementById("bg");
  const cover=document.getElementById("cover");
  const title=document.getElementById("title");
  const artist=document.getElementById("artist");
  const tapeTitle=document.getElementById("tapeTitle");
  const tapeArtist=document.getElementById("tapeArtist");
  const RECENT_LIMIT=5;
  const EMBEDDED_TRACKS=[{"id": "demo-01", "title": "夏夜片段", "artist": "Demo Tape", "audio": "", "image": "", "theme": {"accent": "#d8a85b", "label": "#d8cfb6", "ink": "#24201a", "shell": "#56535d"}}, {"id": "demo-02", "title": "雨后街道", "artist": "Demo Tape", "audio": "", "image": "", "theme": {"accent": "#8fb4c9", "label": "#c8d4d8", "ink": "#172027", "shell": "#46535d"}}, {"id": "demo-03", "title": "旧校服", "artist": "Demo Tape", "audio": "", "image": "", "theme": {"accent": "#b57672", "label": "#d7b9a9", "ink": "#2d1a18", "shell": "#5b4b4c"}}];
  let tracks=[],current=null,recent=[],started=false;

  const fallback=[
    {id:"demo-01",title:"夏夜片段",artist:"Demo Tape",audio:"",image:"",theme:{accent:"#d8a85b",label:"#d8cfb6",ink:"#24201a",shell:"#56535d"}},
    {id:"demo-02",title:"雨后街道",artist:"Demo Tape",audio:"",image:"",theme:{accent:"#8fb4c9",label:"#c8d4d8",ink:"#172027",shell:"#46535d"}},
    {id:"demo-03",title:"旧校服",artist:"Demo Tape",audio:"",image:"",theme:{accent:"#b57672",label:"#d7b9a9",ink:"#2d1a18",shell:"#5b4b4c"}}
  ];

  function hashColor(text,shift=0){let h=shift;for(const ch of text)h=(h*31+ch.charCodeAt(0))>>>0;return `hsl(${h%360} 28% ${36+(h%14)}%)`}
  function svgData(track){
    const c1=track.theme?.accent||hashColor(track.title,7),c2=hashColor(track.artist||track.title,93);
    const t=(track.title||"青春流逝电台").replace(/[<>&]/g,""),a=(track.artist||"").replace(/[<>&]/g,"");
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="1200" height="675" fill="url(#g)"/><rect width="1200" height="675" fill="#090912" opacity=".28"/><circle cx="930" cy="120" r="190" fill="#fff" opacity=".07"/><circle cx="160" cy="590" r="240" fill="#000" opacity=".16"/><text x="72" y="520" fill="#fff" opacity=".92" font-size="64" font-family="serif">${t}</text><text x="76" y="575" fill="#fff" opacity=".55" font-size="24" font-family="sans-serif">${a}</text></svg>`;
    return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg)
  }
  function choose(){let pool=tracks.filter(t=>!recent.includes(t.id));if(!pool.length){recent=[];pool=[...tracks]}const n=pool[Math.floor(Math.random()*pool.length)];recent.push(n.id);if(recent.length>RECENT_LIMIT)recent.shift();return n}
  function theme(track){const x=track.theme||{};document.documentElement.style.setProperty("--accent",x.accent||"#d8a85b");document.documentElement.style.setProperty("--label",x.label||"#d6c8aa");document.documentElement.style.setProperty("--ink",x.ink||"#24201a");document.documentElement.style.setProperty("--shell",x.shell||"#5b5760")}
  function render(track){
    current=track;const image=track.image||svgData(track);theme(track);
    cover.src=image;cover.alt=`${track.title} · ${track.artist||""}`;bg.style.backgroundImage=`linear-gradient(rgba(7,7,15,.28),rgba(7,7,15,.28)),url("${image}")`;
    title.textContent=track.title;artist.textContent=track.artist||"未知";tapeTitle.textContent=track.title;tapeArtist.textContent=track.artist||"未知";
    if(track.audio){audio.src=track.audio;audio.load()}else{audio.removeAttribute("src");audio.load()}
  }
  function setPlaying(on){document.body.classList.toggle("playing",on);playIcon.textContent=on?"Ⅱ":"▶";playBtn.setAttribute("aria-label",on?"暂停":"播放")}
  async function next(auto=false){render(choose());if(auto&&current.audio){try{await audio.play()}catch(_){setPlaying(false)}}}
  playBtn.addEventListener("click",async()=>{if(!current)await next(false);if(!current.audio){setPlaying(true);setTimeout(()=>setPlaying(false),700);return}if(audio.paused){try{await audio.play();started=true}catch(_){setPlaying(false)}}else audio.pause()});
  volume.addEventListener("input",()=>audio.volume=Number(volume.value));
  function clearSleepTimer(){
    sleepDeadline=0;
    if(sleepTicker){clearInterval(sleepTicker);sleepTicker=null}
    timerStatus.textContent="";
    timerBtn.classList.remove("active");
    timerOptions.forEach(b=>b.classList.remove("active"));
  }
  function renderSleepTimer(){
    if(!sleepDeadline)return;
    const left=Math.max(0,sleepDeadline-Date.now());
    if(left<=0){
      audio.pause();
      clearSleepTimer();
      return;
    }
    const total=Math.ceil(left/60000);
    timerStatus.textContent=`${total} 分钟后暂停`;
  }
  function setSleepTimer(minutes){
    clearSleepTimer();
    if(!minutes)return;
    sleepDeadline=Date.now()+minutes*60000;
    timerBtn.classList.add("active");
    timerOptions.find(b=>Number(b.dataset.minutes)===minutes)?.classList.add("active");
    renderSleepTimer();
    sleepTicker=setInterval(renderSleepTimer,15000);
  }
  timerBtn.addEventListener("click",()=>{
    const open=timerMenu.classList.toggle("open");
    timerBtn.setAttribute("aria-expanded",String(open));
  });
  timerOptions.forEach(btn=>btn.addEventListener("click",()=>{
    setSleepTimer(Number(btn.dataset.minutes));
    timerMenu.classList.remove("open");
    timerBtn.setAttribute("aria-expanded","false");
  }));

  audio.addEventListener("playing",()=>setPlaying(true));audio.addEventListener("pause",()=>setPlaying(false));
  audio.addEventListener("ended",async()=>{setPlaying(false);await new Promise(r=>setTimeout(r,850));await next(started)});
  audio.addEventListener("error",async()=>{setPlaying(false);await new Promise(r=>setTimeout(r,500));await next(started)});
  (async()=>{audio.volume=Number(volume.value);tracks=EMBEDDED_TRACKS.length?EMBEDDED_TRACKS:fallback;await next(false)})();
})();
  </script>
</body>
</html>
